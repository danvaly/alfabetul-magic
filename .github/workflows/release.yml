name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual run: builds the chosen branch and creates the tag + release for it
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug keystore for signing
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Run tests
        run: ./gradlew testReleaseUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Get version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT

      - name: Verify and rename APK
        run: |
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/alfabetul-magic-v${{ steps.version.outputs.VERSION }}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete existing release if it exists (e.g. from a previous failed run)
          gh release delete "${{ steps.version.outputs.TAG }}" --yes 2>/dev/null || true

          gh release create "${{ steps.version.outputs.TAG }}" \
            --target "${{ github.sha }}" \
            "app/build/outputs/apk/release/alfabetul-magic-v${{ steps.version.outputs.VERSION }}.apk" \
            --title "Alfabetul Magic v${{ steps.version.outputs.VERSION }}" \
            --notes "## Alfabetul Magic v${{ steps.version.outputs.VERSION }}

          Aplicație educațională pentru învățarea alfabetului românesc.

          ### Descarcă
          Descarcă fișierul APK de mai jos și instalează-l pe tableta ta Android.

          ### Ce este nou
          - Consultă commit-urile pentru detalii"

      - name: Upload release APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: alfabetul-magic-v${{ steps.version.outputs.VERSION }}
          path: app/build/outputs/apk/release/alfabetul-magic-v${{ steps.version.outputs.VERSION }}.apk
          retention-days: 90
