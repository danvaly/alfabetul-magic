name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug keystore for signing
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Run tests
        run: ./gradlew testReleaseUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify APK exists
        run: |
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.2.0
        with:
          name: "Alfabetul Magic v${{ steps.version.outputs.VERSION }}"
          body: |
            ## Alfabetul Magic v${{ steps.version.outputs.VERSION }}

            Aplicație educațională pentru învățarea alfabetului românesc.

            ### Descarcă
            Descarcă fișierul APK de mai jos și instalează-l pe tableta ta Android.

            ### Ce este nou
            - Consultă commit-urile pentru detalii" \
              app/build/outputs/apk/release/alfabetul-magic-v${{ steps.version.outputs.VERSION }}.apk

      - name: Upload release APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: alfabetul-magic-v${{ steps.version.outputs.VERSION }}
          path: app/build/outputs/apk/release/alfabetul-magic-v${{ steps.version.outputs.VERSION }}.apk
          retention-days: 90
