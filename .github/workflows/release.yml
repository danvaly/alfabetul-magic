name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Run tests
        run: ./gradlew testReleaseUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Alfabetul Magic v${{ steps.version.outputs.VERSION }}"
          body: |
            ## Alfabetul Magic v${{ steps.version.outputs.VERSION }}

            Aplicație educațională pentru învățarea alfabetului românesc.

            ### Descarcă
            Descarcă fișierul APK de mai jos și instalează-l pe tableta ta Android.

            ### Ce este nou
            - Consultă commit-urile pentru detalii
          files: |
            app/build/outputs/apk/release/app-release-unsigned.apk
          draft: false
          prerelease: false

      - name: Upload release APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.version.outputs.VERSION }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90
